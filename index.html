<script>
  // 景色は暦と時刻だけで移ろう(描画前に当てて、ちらつきを防ぐ)
  (function () {
    var d = new Date(), m = d.getMonth() + 1, h = d.getHours(), t = 'winter';
    if (!(h >= 18 || h < 6)) t = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
    var pref = 'auto';
    try { pref = localStorage.getItem('ensen_theme') || 'auto'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', pref === 'auto' ? t : pref);
  })();
</script>
